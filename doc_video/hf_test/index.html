<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0b0b0c}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#1c1c1f,#060607);font-family:Inter,system-ui,sans-serif}
.t{position:absolute;left:0;right:0;top:820px;text-align:center;color:#fff;font-size:120px;font-weight:800;letter-spacing:-3px;opacity:0}
.y{color:#FEDE5C}
.bar{position:absolute;left:150px;top:800px;width:14px;height:160px;background:#FEDE5C;transform:scaleY(0);transform-origin:top}
</style></head><body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-fps="30">
 <div class="bar" id="bar"></div>
 <div class="t" id="t">The <span class="y">Downfall</span></div>
</div>
<script src="gsap.min.js"></script>
<script>
const tl=gsap.timeline({paused:true});
tl.to("#bar",{scaleY:1,duration:0.6,ease:"power3.out"},0.2)
  .fromTo("#t",{opacity:0,y:40,filter:"blur(12px)"},{opacity:1,y:0,filter:"blur(0px)",duration:0.9,ease:"expo.out"},0.4)
  .to("#t",{scale:1.04,duration:1.5,ease:"none"},1.3);
window.__timelines=window.__timelines||{}; window.__timelines["root"]=tl;
</script></body></html>
